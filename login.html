<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | Q-Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/lucide@latest/icons" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 3rem 2rem;
            text-align: center;
        }

        .login-header {
            margin-bottom: 2rem;
        }

        .login-header i {
            color: var(--color-brand-primary);
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--color-text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: var(--radius-md);
            outline: none;
            font-family: var(--font-family);
            font-size: 1rem;
        }

        .form-input:focus {
            border-color: var(--color-brand-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .error-msg {
            color: var(--color-danger);
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="login-layout">
            <div class="login-card card-panel">
                <div class="login-header">
                    <i data-lucide="lock"></i>
                    <h2 id="orgName">Q-Sync</h2>
                    <p style="color: var(--color-text-secondary);">Staff & Admin Login</p>
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Enter username">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter password">
                </div>

                <button class="btn btn-primary" id="btnLogin" style="width: 100%; margin-top: 1rem;">Login</button>
                <div id="errorMsg" class="error-msg">Invalid username or password</div>
                
                <div style="margin-top: 2rem; font-size: 0.85rem; color: var(--color-text-secondary);">
                    <p>Demo Credentials:</p>
                    <p>Username: <strong>admin</strong> | Password: <strong>password123</strong></p>
                </div>
                
                <div style="margin-top: 2rem;">
                    <a href="index.html" style="font-size: 0.9rem; color: var(--color-brand-primary); text-decoration: none;">&larr; Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
